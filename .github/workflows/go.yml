name: go
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'go test -run selector (empty = full suite)'
        required: false
        default: ''

jobs:
  build-and-test:
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GO111MODULE: 'on'
      CGO_ENABLED: '0'
    strategy:
      fail-fast: true
      matrix:
        go: ['1.23.x']
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    name: ${{ matrix.go }} on ${{ matrix.os }}
    steps:

    - uses: actions/setup-go@v2
      with:
        go-version: ${{ matrix.go }}

    - id: go-cache-paths
      run: |
        echo "go-build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "go-mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - run: echo ${{ steps.go-cache-paths.outputs.go-build }}
    - run: echo ${{ steps.go-cache-paths.outputs.go-mod }}

    - name: Go Build Cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.go-cache-paths.outputs.go-build }}
        key: ${{ runner.os }}-go-${{ matrix.go }}-build-${{ hashFiles('**/go.sum') }}

    - name: Go Mod Cache (go>=1.15)
      uses: actions/cache@v4
      with:
        path: ${{ steps.go-cache-paths.outputs.go-mod }}
        key: ${{ runner.os }}-go-${{ matrix.go }}-mod-${{ hashFiles('**/go.sum') }}

    - uses: actions/checkout@v2

    - run: go mod download

    - name: go test ./... (verbose, with per-test result summary)
      run: |
        go test -v -run "${{ inputs.test-filter }}" ./... 2>&1 | tee "$RUNNER_TEMP/gotest.log"
        echo "=== go test summary ==="
        awk '/^ *--- PASS/{p++} /^ *--- FAIL/{f++} /^ *--- SKIP/{s++} END{printf "PASSED: %d  FAILED: %d  SKIPPED: %d\n",p,f,s}' "$RUNNER_TEMP/gotest.log"
        echo "=== skipped tests: each one named with its reason ==="
        awk 'NR==FNR{if(/^=== (RUN|CONT|NAME)/){cur=$3} else if(cur!="" && /^ +[^ ]+_test\.go:[0-9]+: /){m=$0; sub(/^ +/,"",m); gsub(/https?:\/\/[^ ]+/,"(link omitted)",m); r[cur]=m}; next} /^ *--- SKIP:/{print "SKIPPED TEST " $3 " -- REASON: " r[$3]}' "$RUNNER_TEMP/gotest.log" "$RUNNER_TEMP/gotest.log"
        echo "SKIPPED TEST NAMES: $(awk '/^ *--- SKIP:/{printf "%s ", $3}' "$RUNNER_TEMP/gotest.log")"
    - if: runner.os == 'Linux'
      run: go test -count=10 -run "${{ inputs.test-filter }}" ./...
      env:
        GOARCH: '386'
    - run: go test -count=10 -run "${{ inputs.test-filter }}" ./...
    - run: go test -count=2 -covermode=atomic -run "${{ inputs.test-filter }}" ./...
    - run: go test -v -count=10 -run TestRaceyPatternSchemaValidateHindersIt -race ./...
      env:
        CGO_ENABLED: '1'
    - run: go test -v -count=10 -run TestRaceyPatternSchemaForIssue775 -race ./...
      env:
        CGO_ENABLED: '1'
    - run: go test -v -count=10 -run TestIssue741 -race ./...
      env:
        CGO_ENABLED: '1'

  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Build module zip with golang.org/x/mod zip.CreateFromDir
      run: |
        cp -r "$GITHUB_WORKSPACE" /tmp/modsrc
        rm -rf /tmp/modsrc/.git
        mkdir -p /tmp/zipper /tmp/out
        cat > /tmp/zipper/main.go <<'GOEOF'
        package main

        import (
            "os"

            "golang.org/x/mod/module"
            "golang.org/x/mod/zip"
        )

        func main() {
            f, err := os.Create(os.Args[3])
            if err != nil {
                panic(err)
            }
            defer f.Close()
            mv := module.Version{Path: "github.com/getkin/kin-openapi", Version: os.Args[1]}
            if err := zip.CreateFromDir(f, mv, os.Args[2]); err != nil {
                panic(err)
            }
        }
        GOEOF
        cd /tmp/zipper
        go mod init zipper
        GOFLAGS=-mod=mod go get golang.org/x/mod@v0.24.0
        go run . v0.126.0 /tmp/modsrc /tmp/out/v0.126.0.zip
        unzip -l /tmp/out/v0.126.0.zip | tail -1
    - uses: actions/upload-artifact@v4
      with:
        name: module-zip
        path: /tmp/out/v0.126.0.zip
        if-no-files-found: error
